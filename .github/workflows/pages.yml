name: Demo auf GitHub Pages
# Publishes the fixture-only design demo (no accounts, no backend, no real data) as a static site.
on:
  push:
    branches: [integration/design-v2, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Statische Demo bauen
        env:
          FAMILYOS_PAGES_BASE: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -w @familyos/web
      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
