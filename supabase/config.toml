project_id = "familyos-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 15
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Sprint 1: passwordless email code (ADR-0007). Same values are set by hand in the hosted project.
[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "1s"
[auth.email.template.magic_link]
subject = "Dein FamilyOS-Code"
content_path = "./supabase/templates/code.html"
[auth.email.template.confirmation]
subject = "Dein FamilyOS-Code"
content_path = "./supabase/templates/code.html"
[auth.rate_limit]
# Local stack only: the e2e test signs in three synthetic accounts.
email_sent = 30
[inbucket]
enabled = true
port = 54324
